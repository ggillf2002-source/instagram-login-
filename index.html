
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account Portal</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111318;color:#fff;font-family:Arial,sans-serif}
.page{display:none;min-height:100vh;padding:25px 20px;flex-direction:column;align-items:center}
.page.active{display:flex}
.top{width:100%;max-width:520px}
.back{color:white;font-size:30px;text-decoration:none}
.brand{text-align:center;margin:auto 0 40px}
.logo{width:90px;height:90px;border-radius:25px;margin:auto auto 20px;background:linear-gradient(140deg,#7b43ef,#db287c,#ff9b35);display:grid;place-items:center}
.cam{width:46px;height:46px;border:5px solid white;border-radius:14px;position:relative}
.cam:before{content:"";position:absolute;width:16px;height:16px;border:4px solid white;border-radius:50%;left:10px;top:10px}
h1{font-size:26px;margin:0 0 10px}
.form{width:100%;max-width:520px;margin:auto}
label{display:block;margin:0 0 8px;font-size:14px}
input{width:100%;padding:18px;margin-bottom:17px;border:1px solid #3a3e47;border-radius:15px;background:#1b1e25;color:white;font-size:16px;outline:none}
input:focus{border-color:#7b9cf5}
.primary{width:100%;padding:17px;border:0;border-radius:35px;background:#2878f0;color:white;font-size:17px;font-weight:bold;cursor:pointer}
.small{font-size:12px;color:#9da4b1;text-align:center;line-height:1.5}
.footer{margin-top:auto;padding-top:30px;color:#8f96a3;font-size:13px}
.loading{width:100%;max-width:520px;margin:auto;text-align:center}
.spinner{width:75px;height:75px;border:6px solid #343945;border-top-color:#8a5cf6;border-right-color:#e13b91;border-radius:50%;margin:0 auto 28px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:#1d2027;border:1px solid #303540;border-radius:18px;padding:20px;text-align:left;margin-top:28px}
.head,.metrics{display:flex;justify-content:space-between;gap:10px}
.head{margin-bottom:14px}
.track{height:13px;border-radius:20px;background:#393e49;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#7254ed,#d83a9b);transition:width .3s}
.metrics{margin-top:13px;color:#c0c6d0;font-size:13px}
#buyPopup{display:none;position:fixed;inset:0;background:#000c;z-index:10;align-items:center;justify-content:center;padding:20px}
.popupBox{width:100%;max-width:380px;background:#1d2027;border:1px solid #464c58;border-radius:20px;padding:25px;text-align:center}
.close{border:0;border-radius:30px;background:#2878f0;color:white;padding:13px 28px;font-size:16px;cursor:pointer}
</style>
</head>
<body>

<section class="page active" id="loginPage">
  <div class="top"><a class="back" href="#">‹</a></div>

  <div class="brand">
    <div class="logo"><div class="cam"></div></div>
    <h1>Account Portal</h1>
  </div>

  <div class="form">
    <label for="username">Username</label>
    <input id="username" type="text" placeholder="Enter username" autocomplete="off">

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Enter password" autocomplete="off">

    <button class="primary" id="continueBtn" type="button">Continue</button>
    <p class="small" id="errorMessage" style="color:#ff6868;display:none">Invalid username or password!</p>
  </div>

  <div class="footer">Interface preview</div>
</section>

<section class="page" id="dataPage">
  <div class="top">
    <a class="back" href="#" id="backBtn">‹</a>
  </div>

  <div class="loading">
    <div class="spinner"></div>
    <h1 id="loadTitle">Opening your ID...</h1>

    <div class="card">
      <div class="head">
        <b>Data package</b>
        <span id="percent">0%</span>
      </div>
      <div class="track">
        <div class="fill" id="fill"></div>
      </div>
      <div class="metrics">
        <span id="amount">0 MB / 8 GB</span>
        <span id="speed">1 MB/s</span>
      </div>
    </div>
  </div>

  <div class="footer">Interface preview</div>
</section>

<div id="buyPopup">
  <div class="popupBox">
    <h2>Buy DNS Data</h2>
    <p style="color:#c0c6d0">Price: ₹135</p>
    <button class="close" id="closePopup">Close</button>
  </div>
</div>

<script>
const loginPage = document.getElementById("loginPage");
const dataPage = document.getElementById("dataPage");
const continueBtn = document.getElementById("continueBtn");
const backBtn = document.getElementById("backBtn");

let downloaded = 0;
const totalMB = 8192;
const popupAtMB = 10;
let timer = null;

function goToDataPage(){
  loginPage.classList.remove("active");
  dataPage.classList.add("active");

  downloaded = 0;
  document.getElementById("buyPopup").style.display = "none";
  document.getElementById("loadTitle").textContent = "Opening your ID...";
  document.getElementById("speed").textContent = "1 MB/s";

  renderProgress();

  if(timer) clearInterval(timer);

  timer = setInterval(function(){
    downloaded++;
    renderProgress();

    if(downloaded >= popupAtMB){
      clearInterval(timer);
      timer = null;
      document.getElementById("loadTitle").textContent = "Data ready!";
      document.getElementById("speed").textContent = "Complete";
      document.getElementById("buyPopup").style.display = "flex";
    }
  },1000);
}

continueBtn.addEventListener("click",function(){
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const error = document.getElementById("errorMessage");

  if(username === "_amandeep_02" && password === "Rk@4321"){
    error.style.display = "none";
    goToDataPage();
  }else{
    error.style.display = "block";
  }
});

backBtn.addEventListener("click",function(e){
  e.preventDefault();

  if(timer){
    clearInterval(timer);
    timer = null;
  }

  dataPage.classList.remove("active");
  loginPage.classList.add("active");
  document.getElementById("buyPopup").style.display = "none";
});

document.getElementById("closePopup").addEventListener("click",function(){
  document.getElementById("buyPopup").style.display = "none";
});

function renderProgress(){
  const percent = (downloaded / totalMB) * 100;

  document.getElementById("fill").style.width = percent + "%";
  document.getElementById("percent").textContent = percent.toFixed(2) + "%";
  document.getElementById("amount").textContent = downloaded + " MB / 8 GB";
}
</script>

</body>
</html>
